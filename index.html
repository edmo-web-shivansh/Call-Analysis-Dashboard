<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Databricks Dashboard Embed</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: "Segoe UI", sans-serif;
      }

      .wrap {
        width: 100%;
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 12px;
      }

      h1 {
        font-size: clamp(1rem, 2.2vw, 1.25rem);
        letter-spacing: 0.02em;
        margin: 0;
        font-weight: 600;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(8px);
      }

      #dashboard-container {
        width: 100%;
        height: 100vh;
        min-height: 300px;
        background: rgba(2, 6, 23, 0.45);
        border: 1px solid var(--panel-border);
        box-shadow: 0 30px 60px rgba(2, 6, 23, 0.45);
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      @media (max-width: 640px) {
        .wrap {
          padding: 10px;
          gap: 8px;
        }

        #dashboard-container {
          height: calc(100dvh - 10px - 8px - 48px - 10px);
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="dashboard-container">
        <iframe
          src="https://dbc-648392cb-719b.cloud.databricks.com/embed/dashboardsv3/01f113ba8ad01614a526ec1ef4a1089d?o=7474652305362798&f_page1%7Ecall_quality_filter=Bad"
          title="Databricks Dashboard"
          loading="lazy"
          allowfullscreen
        >
        </iframe>
      </div>
    </div>
  </body>
</html>
